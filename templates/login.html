{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
<section class="auth-layout">
    <div class="auth-card">
        <div class="auth-card-heading">
            <span class="eyebrow">BEM-VINDO DE VOLTA</span>
            <h1>Entrar</h1>
            <p>Seu segundo projeto em Python começa por aqui.</p>
        </div>

        <form method="POST" class="form-stack">
            <div>
                <label class="form-label" for="email">E-mail</label>
                <input class="form-control form-control-lg" id="email" type="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
            </div>
            <div>
                <label class="form-label" for="senha">Senha</label>
                <input class="form-control form-control-lg" id="senha" type="password" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
        </form>

        <p class="auth-footer">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
    </div>
</section>
{% endblock %}
