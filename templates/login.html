<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login </title>
</head>
<body>
    <div class = "cabecalho">

        <h1> Login de Usuario </h1>

        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <p>{{ mensagem }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method = "POST">
            <label for = "email"> Digite seu e-mail </label> <br>
            <input type = "email" id = "email" name = "email" placeholder = "Email de usuario">
            <br><br>

            <label for = "senha"> Digite sua senha </label> <br>
            <input type = "password" id = "senha" name = "senha" placeholder = "Senha de usuario">
            <br><br>

            <button type = "submit"> Entrar </button>
        </form>

    </div>
</body>
</html>
