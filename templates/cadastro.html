{% extends "base.html" %}

{% block title %}Criar conta{% endblock %}

{% block content %}
<section class="auth-layout">
    <div class="auth-card">
        <div class="auth-card-heading">
            <span class="eyebrow">COMECE A SE ORGANIZAR</span>
            <h1>Criar conta</h1>
            <p>Seus gastos ficam organizados em um só lugar.</p>
        </div>

        <form method="POST" class="form-stack" id="formCadastro">
            <div>
                <label class="form-label" for="nome">Nome</label>
                <input class="form-control" id="nome" type="text" name="nome" placeholder="Seu nome" autocomplete="name" required>
            </div>
            <div>
                <label class="form-label" for="email">E-mail</label>
                <input class="form-control" id="email" type="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
            </div>
            <div>
                <label class="form-label" for="senha">Senha</label>
                <input class="form-control" id="senha" type="password" name="senha" placeholder="Crie uma senha" autocomplete="new-password" required>
            </div>
            <div>
                <label class="form-label" for="confirmar-senha">Confirmar senha</label>
                <input class="form-control" id="confirmar-senha" type="password" placeholder="Digite a senha novamente" autocomplete="new-password" required>
                <div class="form-text">A confirmação é verificada neste formulário.</div>
            </div>
            <button class="btn btn-success btn-lg w-100" type="submit">Cadastrar</button>
        </form>

        <p class="auth-footer">Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
{% endblock %}
