services:
  main:
    build: .
    container_name: controle-gastos
    ports:
      - "5001:5000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      PORT: "5000"
